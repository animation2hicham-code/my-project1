<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Football Results & Live Scores</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #1a253f;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .match-card {
            background: #fff;
            border-radius: 10px;
            padding: 15px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #007bff;
        }

        .team {
            flex: 1;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .home-team {
            text-align: right;
        }

        .away-team {
            text-align: left;
        }

        .score-box {
            background: #eef2f7;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 0 15px;
            min-width: 90px;
            text-align: center;
        }

        .status {
            font-size: 0.75rem;
            display: block;
            color: #28a745;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .loading, .no-matches {
            text-align: center;
            font-size: 1.1rem;
            color: #777;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚽ Today's Football Matches</h1>
            <p id="current-date">Fetching scores...</p>
        </header>

        <div id="matches-container" class="matches-list">
            <div class="loading">Loading today's matches...</div>
        </div>
    </div>

    <script>
        // Set Today's Date in English
        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = today.toLocaleDateString('en-US', options);

        // API Configuration (Using Football-Data.org Free Endpoint)
        // NOTE: Replace 'YOUR_API_KEY' with your actual free key from football-data.org if needed.
        const API_KEY = 'YOUR_API_KEY'; 

        async function fetchTodayMatches() {
            const matchesContainer = document.getElementById('matches-container');

            try {
                // Fetching matches from Football-Data API
                const response = await fetch('https://api.football-data.org/v4/matches', {
                    headers: { 'X-Auth-Token': API_KEY }
                });

                if (!response.ok) {
                    throw new Error('API limits reached or key missing');
                }

                const data = await response.json();
                const matches = data.matches;

                matchesContainer.innerHTML = ''; // Clear loading text

                if (!matches || matches.length === 0) {
                    matchesContainer.innerHTML = '<div class="no-matches">No matches scheduled for today.</div>';
                    return;
                }

                // Loop through today's matches and display them
                matches.forEach(match => {
                    const matchElement = document.createElement('div');
                    matchElement.className = 'match-card';

                    const homeTeam = match.homeTeam.shortName || match.homeTeam.name;
                    const awayTeam = match.awayTeam.shortName || match.awayTeam.name;
                    
                    // Scores logic
                    const homeScore = match.score.fullTime.home !== null ? match.score.fullTime.home : '-';
                    const awayScore = match.score.fullTime.away !== null ? match.score.fullTime.away : '-';
                    const status = match.status; // FINISHED, IN_PLAY, TIMED, etc.

                    matchElement.innerHTML = `
                        <div class="team home-team">${homeTeam}</div>
                        <div class="score-box">
                            ${homeScore} - ${awayScore}
                            <span class="status">${status}</span>
                        </div>
                        <div class="team away-team">${awayTeam}</div>
                    `;

                    matchesContainer.appendChild(matchElement);
                });

            } catch (error) {
                console.log(error);
                // Demo / Fallback Data if API Key is not set yet
                displayDemoData();
            }
        }

        // Demo data to display if API token is missing
        function displayDemoData() {
            const matchesContainer = document.getElementById('matches-container');
            matchesContainer.innerHTML = `
                <div style="text-align:center; color:orange; margin-bottom:15px; font-size:0.85rem;">
                    ⚠️ Showing sample data. Add your free API key to see live daily matches!
                </div>
                <div class="match-card">
                    <div class="team home-team">Real Madrid</div>
                    <div class="score-box">2 - 1<span class="status">FINISHED</span></div>
                    <div class="team away-team">Barcelona</div>
                </div>
                <div class="match-card">
                    <div class="team home-team">Arsenal</div>
                    <div class="score-box">3 - 0<span class="status">FINISHED</span></div>
                    <div class="team away-team">Chelsea</div>
                </div>
                <div class="match-card">
                    <div class="team home-team">PSG</div>
                    <div class="score-box">- - -<span class="status" style="color:#007bff">20:00 UTC</span></div>
                    <div class="team away-team">Marseille</div>
                </div>
            `;
        }

        // Fetch matches when page loads
        fetchTodayMatches();
    </script>
</body>
</html>
